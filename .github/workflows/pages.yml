# V3 im Browser ansehen: baut das App-Webpaket (www) und legt es auf GitHub Pages.
# Einmalig nötig: Repo-Einstellungen → Pages → Source „GitHub Actions“.
# Ohne Android-Brücke laufen Mailkonten, Speicherort und Teilen dort nicht; Aussehen und Themen schon.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
