name: V3-Android-Veröffentlichung (Private Brain V3 Pro)
# Nur von Hand und nur auf Klaus' ausdrücklichen Wunsch. Baut die signierte Vorschau-App
# de.familyprojekt.privatebrain.v3.preview (APK + AAB), veröffentlicht sie als GitHub-Vorabversion unter dem Tag
# v3-android-<versionName> in DIESEM Repo und lädt die öffentliche APK zum Vergleich wieder herunter.
# Pros Update-Kanal (lausiklauskn-png/Privat-Brain-Pro, Tags v1.0.0-preview.N) wird nie berührt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: versionName zur Bestätigung, genau wie in android/app/build.gradle (z. B. 3.0.0-preview.1)
        required: true
        type: string
      dry_run:
        description: Nur bauen und prüfen, nicht veröffentlichen
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-android-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Version, Tag und main-Commit prüfen
        id: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || { echo '::error::Version muss wie 3.0.0-preview.1 aussehen.'; exit 1; }
          grep -Fq "versionName \"$VERSION\"" android/app/build.gradle || { echo '::error::versionName in android/app/build.gradle ist nicht '"$VERSION"'.'; exit 1; }
          grep -Fq 'applicationId "de.familyprojekt.privatebrain.v3"' android/app/build.gradle
          tag="v3-android-$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then echo "::error::Tag $tag gibt es schon."; exit 1; fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Grüne Android-Prüfung (android.yml) auf demselben main-Commit verlangen
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$SOURCE_SHA&per_page=50" > "$RUNNER_TEMP/runs.json"
          jq -e '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .conclusion == "success")] | length > 0' "$RUNNER_TEMP/runs.json" \
            || { echo '::error::Für diesen Commit gibt es keinen vollständig grünen android.yml-Lauf auf main.'; exit 1; }
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK prüfen
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: V3-Signierer nur für diesen Job freigeben
        env:
          V3_SIGNING_UNLOCK: ${{ secrets.V3_SIGNING_UNLOCK }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/signing-v3/cli.mjs prepare-gradle
      - run: npm ci --ignore-scripts
      - run: npm run sync:android
      - name: Signierte APK und App Bundle bauen
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assemblePreview bundlePreview
      - name: Paket, Name, Version, Debug-Flag und Zertifikat prüfen
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          expected=$(jq -er '.certificateSha256' signing/v3-android-certificate.json)
          mkdir -p release-files
          apk="release-files/Private-Brain-V3-Pro-$VERSION.apk"
          aab="release-files/Private-Brain-V3-Pro-$VERSION.aab"
          cp android/app/build/outputs/apk/preview/app-preview.apk "$apk"
          cp android/app/build/outputs/bundle/preview/app-preview.aab "$aab"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt")" = "$expected"
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/signature.txt")" = 1
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='de.familyprojekt.privatebrain.v3.preview'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          grep -Fxq "application-label:'Private Brain V3 Pro'" "$RUNNER_TEMP/badging.txt"
          ! grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/aab-cert.txt"
          test "$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -n1 | tr -d ':' | tr 'A-F' 'a-f')" = "$expected"
          (cd release-files; sha256sum ./*.apk ./*.aab > SHA256SUMS)
          { echo "Paket de.familyprojekt.privatebrain.v3.preview, Version $VERSION"; echo; echo "Zertifikat SHA-256 $expected"; echo; sed 's/^/    /' release-files/SHA256SUMS; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: v3-android-release
          path: release-files/
          if-no-files-found: error
          retention-days: 7
      - name: Temporären Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/private-brain-v3.p12"
  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: v3-android-release
          path: release-files
      - name: Als Vorabversion veröffentlichen und öffentlichen Download bytegleich prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          (cd release-files; sha256sum -c SHA256SUMS)
          # Draft first: never make an incomplete upload publicly visible.
          gh release create "$TAG" release-files/* --draft --prerelease --target "$SOURCE_SHA" \
            --title "Private Brain V3 Pro $VERSION (Android)" \
            --notes "Vorschau von Private Brain V3 Pro für Android (Paket de.familyprojekt.privatebrain.v3.preview). Installiert sich neben Private Brain Pro und lässt es unberührt."
          gh release edit "$TAG" --draft=false
          mkdir public-download
          for file in release-files/*.apk release-files/*.aab; do
            name=$(basename "$file")
            curl --fail --location --retry 5 --retry-all-errors "https://github.com/$GH_REPO/releases/download/$TAG/$name" -o "public-download/$name"
            cmp "$file" "public-download/$name"
            sha256sum "public-download/$name" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Download: https://github.com/$GH_REPO/releases/download/$TAG/Private-Brain-V3-Pro-$VERSION.apk" >> "$GITHUB_STEP_SUMMARY"
